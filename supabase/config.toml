# Configuração local do Supabase CLI para o SynapseMed.
#
# Validado em 2026-09-03 rodando de fato contra Supabase CLI 2.116.0 +
# Docker local (`supabase start` / `supabase db reset` / `supabase test db`,
# todos com sucesso). Escrito à mão originalmente (antes de o CLI estar
# disponível neste ambiente), depois confirmado compatível com a versão
# real instalada.

project_id = "synapsemed"

[api]
enabled = true
port = 54321
# "app" NÃO está listado aqui de propósito: os helpers internos de
# autorização (app.is_admin_active, app.current_profile_status) não podem
# virar rota REST/RPC pública, mesmo tendo GRANT EXECUTE para "authenticated".
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[analytics]
enabled = false
